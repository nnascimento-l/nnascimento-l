<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Lucas Nascimento - Informática para Negócios" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="0.6" stop-color="#2b0f4a"/>
      <stop offset="1" stop-color="#7a1f5c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff5f6d"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#b3122a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3b0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb86b"/>
      <stop offset="1" stop-color="#ff5f6d"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1280" height="320" rx="14"/></clipPath>

    <g id="cityShapes" fill="#140a26" opacity="0.9">
      <rect x="0" y="190" width="60" height="70"/>
      <rect x="70" y="160" width="45" height="100"/>
      <rect x="125" y="200" width="70" height="60"/>
      <rect x="205" y="150" width="50" height="110"/>
      <rect x="265" y="185" width="80" height="75"/>
      <rect x="355" y="170" width="45" height="90"/>
      <rect x="410" y="195" width="65" height="65"/>
      <rect x="485" y="145" width="55" height="115"/>
      <rect x="550" y="180" width="75" height="80"/>
      <rect x="635" y="200" width="50" height="60"/>
      <rect x="695" y="165" width="60" height="95"/>
      <rect x="765" y="190" width="70" height="70"/>
      <rect x="845" y="150" width="50" height="110"/>
      <rect x="905" y="185" width="80" height="75"/>
      <rect x="995" y="170" width="45" height="90"/>
      <rect x="1050" y="200" width="70" height="60"/>
      <rect x="1130" y="155" width="55" height="105"/>
      <rect x="1195" y="185" width="85" height="75"/>
    </g>
  </defs>

  <style>
    .city { animation: scroll 40s linear infinite; }
    .dash { animation: scroll100 0.5s linear infinite; }
    .speed { animation: fly 1.3s linear infinite; }
    .s2 { animation-delay: -0.4s; animation-duration: 1.1s; }
    .s3 { animation-delay: -0.8s; animation-duration: 1.5s; }
    .s4 { animation-delay: -0.2s; animation-duration: 0.9s; }
    .bounce { animation: bounce 0.5s ease-in-out infinite alternate; }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .st2 { animation-delay: -1s; }
    .st3 { animation-delay: -2s; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-1280px); } }
    @keyframes scroll100 { from { transform: translateX(0); } to { transform: translateX(-100px); } }
    @keyframes fly { from { transform: translateX(1300px); } to { transform: translateX(-300px); } }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-2px); } }
    @keyframes twinkle { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1280" height="320" fill="url(#sky)"/>

    <!-- estrelas -->
    <g fill="#ffffff">
      <circle class="star" cx="120" cy="30" r="1.8"/>
      <circle class="star st2" cx="330" cy="55" r="1.4"/>
      <circle class="star st3" cx="520" cy="25" r="1.8"/>
      <circle class="star" cx="700" cy="60" r="1.4"/>
      <circle class="star st2" cx="860" cy="28" r="1.8"/>
      <circle class="star st3" cx="1040" cy="50" r="1.4"/>
      <circle class="star" cx="1190" cy="30" r="1.8"/>
      <circle class="star st2" cx="1250" cy="85" r="1.4"/>
    </g>

    <!-- sol -->
    <circle cx="1010" cy="238" r="82" fill="url(#sun)"/>

    <!-- cidade em movimento -->
    <g class="city">
      <use xlink:href="#cityShapes"/>
      <use xlink:href="#cityShapes" x="1280"/>
    </g>

    <!-- pista -->
    <rect y="250" width="1280" height="70" fill="#10101b"/>
    <rect y="250" width="1280" height="3" fill="#ff8a5b"/>
    <g class="dash">
      <line x1="0" y1="296" x2="1480" y2="296" stroke="#ffd166" stroke-width="5" stroke-dasharray="60 40"/>
    </g>

    <!-- linhas de velocidade -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4">
      <line class="speed" x1="0" y1="205" x2="120" y2="205"/>
      <line class="speed s2" x1="0" y1="232" x2="90" y2="232"/>
      <line class="speed s3" x1="0" y1="268" x2="140" y2="268"/>
      <line class="speed s4" x1="0" y1="310" x2="100" y2="310"/>
    </g>

    <!-- carro -->
    <g transform="translate(820,178)">
      <ellipse cx="172" cy="95" rx="165" ry="7" fill="#000" opacity="0.5"/>
      <g class="bounce">
        <polygon points="330,58 560,22 560,98" fill="url(#beam)"/>
        <path d="M 8 78 C 8 60, 14 50, 40 46 L 100 40 C 120 18, 140 8, 175 8 L 215 8 C 240 10, 258 30, 270 40 L 316 48 C 334 52, 340 64, 337 78 Z" fill="url(#body)"/>
        <path d="M 14 46 L 6 34 L 42 32 L 44 44 Z" fill="#7d0f22"/>
        <path d="M 112 38 C 128 20, 145 14, 175 14 L 212 14 C 232 16, 246 30, 256 38 Z" fill="#9fd8ff" opacity="0.9"/>
        <line x1="190" y1="14" x2="192" y2="38" stroke="#b3122a" stroke-width="3"/>
        <path d="M 30 62 L 322 64" stroke="#ffffff" stroke-width="3" opacity="0.5"/>
        <ellipse cx="327" cy="58" rx="8" ry="5" fill="#fff3b0"/>
        <rect x="8" y="54" width="10" height="7" rx="2" fill="#ff1f3d"/>

        <circle cx="75" cy="76" r="25" fill="#0b0e14"/>
        <circle cx="265" cy="76" r="25" fill="#0b0e14"/>

        <circle cx="75" cy="76" r="19" fill="#0a0a0f"/>
        <circle cx="75" cy="76" r="12" fill="#cfd5dd"/>
        <g stroke="#4a4f5a" stroke-width="3">
          <animateTransform attributeName="transform" type="rotate" from="0 75 76" to="360 75 76" dur="0.4s" repeatCount="indefinite"/>
          <line x1="64" y1="76" x2="86" y2="76"/>
          <line x1="64" y1="76" x2="86" y2="76" transform="rotate(60 75 76)"/>
          <line x1="64" y1="76" x2="86" y2="76" transform="rotate(120 75 76)"/>
        </g>
        <circle cx="75" cy="76" r="3" fill="#222"/>

        <circle cx="265" cy="76" r="19" fill="#0a0a0f"/>
        <circle cx="265" cy="76" r="12" fill="#cfd5dd"/>
        <g stroke="#4a4f5a" stroke-width="3">
          <animateTransform attributeName="transform" type="rotate" from="0 265 76" to="360 265 76" dur="0.4s" repeatCount="indefinite"/>
          <line x1="254" y1="76" x2="276" y2="76"/>
          <line x1="254" y1="76" x2="276" y2="76" transform="rotate(60 265 76)"/>
          <line x1="254" y1="76" x2="276" y2="76" transform="rotate(120 265 76)"/>
        </g>
        <circle cx="265" cy="76" r="3" fill="#222"/>
      </g>
    </g>

    <!-- texto -->
    <text x="72" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ff5f6d" opacity="0.55">Lucas Nascimento</text>
    <text x="68" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Lucas Nascimento</text>
    <rect x="70" y="138" width="130" height="5" rx="2.5" fill="url(#bar)"/>
    <text x="70" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ffd9a8">Informática para Negócios | Tecnologia e Negócios</text>
  </g>
</svg>
